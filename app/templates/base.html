<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}VulnLab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">VulnLab</a>
    {% if user %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('profile', username=user['username']) }}">Profile</a>
      <a href="{{ url_for('fetch_url') }}">Link Preview</a>
      <span class="who">logged in as {{ user['username'] }}{% if user['is_admin'] %} (admin){% endif %}</span>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
