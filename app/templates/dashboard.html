{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
  <h1>Your notes</h1>
  <form action="{{ url_for('search_notes') }}" method="get" class="search">
    <input type="text" name="q" placeholder="Search notes by title...">
    <button type="submit">Search</button>
  </form>
  <ul>
    {% for note in notes %}
      <li><a href="{{ url_for('view_note', note_id=note['id']) }}">{{ note['title'] }}</a> (id {{ note['id'] }})</li>
    {% else %}
      <li>No notes yet.</li>
    {% endfor %}
  </ul>
  <p><a href="{{ url_for('new_note') }}">+ New note</a></p>
{% endblock %}
